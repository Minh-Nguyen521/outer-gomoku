name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (release preset)
        run: cmake --preset release

      - name: Build release
        run: cmake --build --preset release

      - name: Test release
        run: ctest --test-dir build/release --output-on-failure --timeout 600

      # Dev preset (asan/ubsan) is kept as a separate, non-blocking step:
      # sanitized builds are 20-50x slower and can exceed the runner's
      # default test timeout even on healthy code.
      - name: Configure (dev preset)
        run: cmake --preset dev

      - name: Build dev
        run: cmake --build --preset dev

      - name: Test dev (sanitizers, non-blocking)
        run: ctest --test-dir build/dev --output-on-failure --timeout 900 || echo "sanitizer tests failed (non-blocking)"
