# Minimal KataGomo config for SkyZero V5 (b10c128) on single-CPU Eigen+AVX2.

logFile = piskvork.log
logSearchInfo = false
logToStderr = false

# === Rules ===
basicRule = RENJU
VCNRule = NOVC
firstPassWin = false
maxMoves = 0

# === Search params ===
numSearchThreads = 1
maxVisits = 100000
maxPlayouts = 100000
# Per-move time is taken from INFO timeout_turn at runtime.

# Extra time safety: KataGo applies this on top of the 50ms buffer in
# piskvork.cpp::makeTC. Total margin per move = 50ms + 50ms = ~100ms.
# Cheap insurance against scheduling jitter / NN cold-start variance.
lagBuffer = 0.05

# Standard KataGo search knobs (defaults are fine; explicit for clarity)
cpuctExploration = 1.1
cpuctExplorationLog = 0.45
cpuctExplorationBase = 500
fpuReductionMax = 0.2
rootNumSymmetriesToSample = 1
rootSymmetryPruning = false
rootEndingBonusPoints = 0

# === Disable features our V5 model doesn't compute ===
useVCFInput = false
useForbiddenInput = true

# === NN backend ===
nnRandomize = false
nnRandSeed = 0
# V5 b10c128 + 1-thread search → tiny batch. Keep small for low latency.
nnMaxBatchSize = 1
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 13

# === Misc ===
ponderingEnabled = false
hasButton = false
analysisPVLen = 10
